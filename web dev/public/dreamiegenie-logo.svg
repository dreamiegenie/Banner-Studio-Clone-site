  <!-- Face -->
  <path d="M211 237c9-13 23-13 32 0" fill="none" stroke="#6F3C96" stroke-width="7" stroke-linecap="round"/>
  <path d="M269 237c9-13 23-13 32 0" fill="none" stroke="#6F3C96" stroke-width="7" stroke-linecap="round"/>
  <path d="M250 252c4 5 8 5 12 0" fill="none" stroke="#6F3C96" stroke-width="6" stroke-linecap="round"/>
  <circle cx="215" cy="254" r="9" fill="#F18EBD"/>
  <circle cx="297" cy="254" r="9" fill="#F18EBD"/>

