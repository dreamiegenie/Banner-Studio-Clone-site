<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>dreamiegenie logo</title>
  <desc>Pastel kawaii dream genie logo with a crescent moon, sparkles and magic lamp.</desc>

  <!-- Soft pastel badge -->
  <circle cx="256" cy="256" r="244" fill="#FFF0F8"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#E7B8E8" stroke-width="6"/>

  <!-- Crescent moon -->
  <path d="M365 83c-25 17-41 45-41 76 0 50 40 90 90 90 14 0 28-3 40-9-20 31-55 51-94 51-62 0-112-50-112-112 0-47 29-88 70-104 15-6 31-9 47-8z"
