  <path d="M121 123l7 18 18 7-18 7-7 18-7-18-18-7 18-7z" fill="#C99AE8"/>
  <path d="M405 170l6 15 15 6-15 6-6 15-6-15-15-6 15-6z" fill="#F39BC7"/>
  <path d="M104 291l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#FFD66D"/>
  <path d="M409 320l7 17 17 7-17 7-7 17-7-17-17-7 17-7z" fill="#C99AE8"/>

